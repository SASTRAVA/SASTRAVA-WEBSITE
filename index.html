    <style>
      .static-site-fallback{min-height:100vh;background:#0b0f1a;color:#ededed;font-family:"DM Sans",system-ui,sans-serif;line-height:1.65}
      .static-site-fallback *{box-sizing:border-box}
      .static-site-fallback a{color:#fff3b0;text-decoration:underline;text-underline-offset:4px}
      .static-header,.static-footer{max-width:1200px;margin:auto;padding:1.25rem 1.5rem}
      .static-header{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;border-bottom:1px solid #ffffff20}
      .static-brand{font-family:Syne,system-ui,sans-serif;font-size:1.3rem;font-weight:800;letter-spacing:.08em;text-decoration:none!important}
      .static-site-fallback nav ul{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;margin:0;padding:0;list-style:none}
      .static-site-fallback nav a{font-size:.95rem}
      .static-hero,.static-section,.static-standard{max-width:1200px;margin:auto;padding:clamp(3rem,8vw,6rem) 1.5rem}
      .static-hero{max-width:980px;margin-left:max(1.5rem,calc((100vw - 1200px)/2));margin-right:auto}
      .static-eyebrow,.static-number{color:#1ecdb0;font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
      .static-site-fallback h1,.static-site-fallback h2,.static-site-fallback h3{font-family:Syne,system-ui,sans-serif;line-height:1.15}
      .static-site-fallback h1{max-width:900px;margin:.8rem 0 1.5rem;font-size:clamp(2.5rem,6vw,4.6rem);letter-spacing:-.035em}
      .static-site-fallback h2{margin:.75rem 0 1rem;font-size:clamp(1.8rem,4vw,2.8rem)}
      .static-site-fallback h3{margin:.5rem 0;font-size:1.2rem}
      .static-lede{max-width:800px;color:#d6d7dc;font-size:clamp(1.05rem,2vw,1.25rem)}
      .static-location{margin-top:1.5rem;color:#c7c8cf}
      .static-actions{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:2rem}
      .static-actions a{display:inline-flex;min-height:48px;align-items:center;border-radius:.75rem;padding:.7rem 1.1rem;font-weight:700}
      .static-primary{background:#e6c200;color:#0b0f1a!important;text-decoration:none!important}
      .static-secondary{border:1px solid #1ecdb080;text-decoration:none!important}
      .static-section{border-top:1px solid #ffffff16}
      .static-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-top:2rem}
      .static-card{border:1px solid #ffffff20;border-radius:1rem;background:#0d0f1d;padding:1.35rem}
      .static-card p{color:#c7c8cf}
      .static-number{margin:0}
      .static-steps{grid-template-columns:repeat(3,minmax(0,1fr))}
      .static-cta{margin-top:2rem}
      .static-standard{min-height:65vh}
      .static-faq dl>div{margin:1.2rem 0}
      .static-faq dt{font-weight:700}
      .static-faq dd{margin:.4rem 0;color:#c7c8cf}
      .static-link-list{display:flex;flex-wrap:wrap;gap:1rem 1.5rem;padding-left:1.25rem}
      .static-footer{border-top:1px solid #ffffff20;color:#c7c8cf}
      .static-footer-brand{max-width:780px}
      .static-footer-brand>a{font-family:Syne,system-ui,sans-serif;font-size:1.5rem;font-weight:800;letter-spacing:.08em}
      .static-footer address{font-style:normal;line-height:1.9}
      .static-footer-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.5rem;margin:2.5rem 0}
      .static-footer-grid h2{font-size:1.1rem;color:#fff3b0}
      .static-footer-grid ul{display:grid;gap:.25rem;margin:0;padding:0;list-style:none}
      .static-footer-grid a{display:inline-flex;min-height:40px;align-items:center;padding:.25rem 0}
      .static-breadcrumb{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1.5rem;color:#c7c8cf;font-size:.9rem}
      @media(max-width:900px){.static-footer-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
      @media(max-width:700px){.static-header{align-items:flex-start;flex-direction:column}.static-grid,.static-steps{grid-template-columns:1fr}.static-hero{margin:0;padding-top:3rem}.static-footer-grid{grid-template-columns:1fr}}
